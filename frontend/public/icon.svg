<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="45%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0a0617"/>
    </linearGradient>
    <linearGradient id="glow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#c4a1ff"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="highlight" cx="30%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle ambient glow overlay -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#highlight)"/>

  <!-- Haffadh "H" monogram with a roofline to evoke home -->
  <g filter="url(#softGlow)">
    <!-- Roof line: subtle slanted top -->
    <path d="M 128 168 L 256 112 L 384 168"
          stroke="url(#glow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    <!-- Left vertical -->
    <rect x="138" y="184" width="40" height="216" rx="20" fill="url(#glow)"/>
    <!-- Right vertical -->
    <rect x="334" y="184" width="40" height="216" rx="20" fill="url(#glow)"/>
    <!-- Crossbar -->
    <rect x="158" y="272" width="196" height="40" rx="20" fill="url(#glow)"/>
  </g>

  <!-- Inner border for depth -->
  <rect x="4" y="4" width="504" height="504" rx="108" ry="108" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
</svg>
